[package]
name = "kitlang"
version = "0.1.1"
edition = "2024"
authors = ["zephhhhhh"]
license = "MIT"
description = "A statically-typed, Rust-inspired programming language designed for embedding"
repository = "https://github.com/zephhhhhh/kitlang"
keywords = ["compiler", "interpreter", "language", "embedded", "scripting"]
categories = ["compilers", "scripting", "addon-support"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["logging", "colour"]
colour = ["dep:inline_colorization"]
logging = ["dep:log", "dep:simplelog", "dep:console_log"]
webasm = ["serde", "dep:wasm-bindgen", "dep:js-sys", "dep:web-time"]
serde = ["dep:serde", "dep:serde_json"]

[dependencies]
# Error handling..
thiserror = "2.0.17"

# Character handling..
unicode-xid = "0.2.6"
rustc-literal-escaper = "0.0.5"

# Logging and formatting..
humanize-duration = "0.0.7"
inline_colorization = { version = "0.1.6", optional = true }
log = { version = "0.4.29", optional = true }
simplelog = { version = "0.12.2", optional = true }

# WebAssembly dependencies..
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3.83", optional = true }
web-time = { version = "1.1.0", optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true}
serde_json = { version = "1.0.145", optional = true }
console_log = { version = "1.0", features = ["color"], optional = true }

# Macros..
kitlang-macros = { path = "crates/kitlang-macros" }
paste = "1.0.15"

# Utilities..
smolvec = "1.0.0"
itertools = "0.14.0"

[workspace]
members = ["crates/kitlang-macros"]

[profile.release]
lto = "fat"
codegen-units = 1